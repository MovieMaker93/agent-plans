# yaml-language-server: $schema=../../../schemas/plan.schema.json
# Instantiate with: python -m planner instantiate announcement --into plans/<slug> --plan-id <id>
schema_version: 1
plan_id: template-announcement
version: 1
title: Announcement
template_kind: announcement
priority: 0
goal: Publish a short product announcement.
owner: orchestrator
definition_of_done: published_urls.json lists a URL that shows the approved copy.
budget:
  tokens: 400000
  hours: 6
  usd: 15
human_approval_policy: >
  A human approves the copy before anyone publishes it.
  While that gate is open, do not post.
constraints:
  deadline: "2026-10-16T17:00:00-05:00"
  max_parallel: 2
  schedule_origin: "2026-10-08T09:00:00-05:00"
deliverables:
  - published_urls.json
tasks:
  - id: T1
    title: Research brief
    task_type: research
    objective: Write a one-page brief the announcement can cite.
    inputs: []
    outputs:
      - artifact: research_brief.md
        type: markdown
    depends_on: []
    estimate_hours:
      optimistic: 1
      likely: 1
      pessimistic: 1
    required_capabilities:
      - research
    assignee: research
    acceptance_criteria:
      - research_brief.md states the product fact and the audience.
    risk: low
    reversible: true
    needs_human: false
    budget:
      tokens: 80000
      hours: 2
      usd: 2
    max_retries: 2
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0
  - id: T2
    title: Publish the announcement
    task_type: publish
    objective: Post the approved announcement and record the URL.
    inputs:
      - artifact: research_brief.md
        from_task: T1
    outputs:
      - artifact: published_urls.json
        type: json
    depends_on:
      - T1
    estimate_hours:
      optimistic: 1
      likely: 1
      pessimistic: 1
    required_capabilities:
      - social_posting
    assignee: social
    acceptance_criteria:
      - published_urls.json lists a URL that shows the approved copy.
    risk: high
    reversible: false
    needs_human: true
    budget:
      tokens: 40000
      hours: 2
      usd: 1
    max_retries: 1
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0
