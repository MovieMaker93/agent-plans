# planner-check runs on merge requests and branches. commit-hygiene runs the
# history guard on the default branch and on tags, with a full clone.
stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
    paths:
      - .cache/pip

planner-check:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - pip install --disable-pip-version-check -r requirements.txt
    - python -m planner check

commit-hygiene:
  stage: test
  image: python:3.12-slim
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - python scripts/check_commit_hygiene.py --all
