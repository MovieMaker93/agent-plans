# yaml-language-server: $schema=../../schemas/plan.schema.json
schema_version: 1
plan_id: ml-handoff-2026-10
version: 1
title: Study with a GPU handoff
goal: >
  Prepare a study on CPU, hand the training run to an external executor, and stop at a handoff milestone.
owner: orchestrator
definition_of_done: >
  handoff_record.md records that the training run was accepted.
budget:
  tokens: 100000
  hours: 12
  usd: 10
human_approval_policy: >
  Accepting the training handoff needs a person. CPU preparation does not. The safe default is hold.
constraints:
  deadline: "2026-10-10T17:00:00-05:00"
  max_parallel: 2
  schedule_origin: "2026-10-08T09:00:00-05:00"
deliverables:
  - handoff_record.md
tasks:
  - id: T1
    title: Prepare the dataset
    section: CPU
    task_type: data_prep
    objective: Build the CPU dataset the training run will read.
    inputs: []
    outputs:
      - artifact: dataset_manifest.md
        type: markdown
    depends_on: []
    estimate_hours:
      optimistic: 2
      likely: 2
      pessimistic: 2
    required_capabilities:
      - research
    assignee: research
    acceptance_criteria:
      - dataset_manifest.md lists the rows and the split.
    risk: low
    reversible: true
    needs_human: false
    budget:
      tokens: 10000
      hours: 4
      usd: 0
    max_retries: 1
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0

  - id: T2
    title: Write the training note
    section: CPU
    task_type: analysis
    objective: Describe the run the external executor should start.
    inputs:
      - artifact: dataset_manifest.md
        from_task: T1
    outputs:
      - artifact: training_note.md
        type: markdown
    depends_on:
      - T1
    estimate_hours:
      optimistic: 2
      likely: 2
      pessimistic: 2
    required_capabilities:
      - synthesis
    assignee: research
    acceptance_criteria:
      - training_note.md names the dataset and the stopping rule.
    risk: low
    reversible: true
    needs_human: false
    budget:
      tokens: 10000
      hours: 4
      usd: 0
    max_retries: 1
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0

  - id: T3
    title: Run training
    section: GPU
    task_type: gpu_training
    objective: Hand the training note to the external executor and record the run.
    inputs:
      - artifact: training_note.md
        from_task: T2
    outputs:
      - artifact: training_log.md
        type: log
    depends_on:
      - T2
    estimate_hours:
      optimistic: 4
      likely: 4
      pessimistic: 4
    required_capabilities:
      - gpu
    assignee: cloud-worker
    acceptance_criteria:
      - training_log.md records a finished run and the metric in training_note.md.
    risk: low
    reversible: true
    needs_human: false
    budget:
      tokens: 10000
      hours: 4
      usd: 0
    max_retries: 1
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0

  - id: M1
    title: Accept the handoff
    section: Handoff
    task_type: human_approval
    objective: Record that the training run is accepted or sent back.
    inputs:
      - artifact: training_log.md
        from_task: T3
    outputs:
      - artifact: handoff_record.md
        type: markdown
    depends_on:
      - task: T3
        type: FS
        lag_hours: 0
    estimate_hours:
      optimistic: 0
      likely: 0
      pessimistic: 0
    required_capabilities:
      - human_approval
    assignee: human
    acceptance_criteria:
      - handoff_record.md says accept or return, and names the person and the time.
    risk: medium
    reversible: true
    needs_human: true
    budget:
      tokens: 0
      hours: 0
      usd: 0
    max_retries: 0
    status: planned
    actuals:
      start: null
      end: null
      hours: null
      attempts: 0
