# Generated by `python -m planner calibrate --apply`. Do not edit by hand.
# factor = clamp(1 + (n / (n + prior_strength)) * (pooled actual/likely - 1)).
# Samples are done tasks only. The schedule multiplies raw PERT expected by factor.
# Optimistic, likely, and pessimistic are never rewritten by this file.
# by_kind groups those samples by plan.template_kind. Plan overrides are not stored here.
schema_version: 1
method: actual_over_likely_shrunk
lookup: "plan pair, then plan task_type, then plan assignee, then plan factor, then pair, then task_type, then assignee, then overall, then template_kind, else 1"
prior_strength: 3
clamp_min: 0.5
clamp_max: 2
samples: 0
skipped_zero_likely: 0
as_of: null
source_plans:
  - launch-announce-2026-10
overall:
  n: 0
  raw_ratio: null
  factor: 1
by_pair: []
by_task_type: []
by_assignee: []
by_kind: []
